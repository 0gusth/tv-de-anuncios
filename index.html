<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TV de Anúncios</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #fff; }
  video, #yt, #yt iframe { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; border: 0; }
  #yt, video { display: none; }
  #escudo { position: fixed; inset: 0; }

  .tarja { position: fixed; left: 48px; bottom: 48px; max-width: 70vw;
    padding: 18px 22px 16px; background: rgba(0,0,0,.62); border-left: 4px solid #fff; backdrop-filter: blur(6px); }
  .linha1 { display: flex; align-items: center; gap: 10px; }
  .anunciante { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
  .novo { font-size: 10px; font-weight: 700; letter-spacing: .12em; background: #fff; color: #000; padding: 2px 6px; border-radius: 2px; display: none; }
  .titulo { font-size: 28px; font-weight: 700; line-height: 1.15; margin: 6px 0 8px; }
  .agencia { font-size: 15px; opacity: .85; }
  .agencia:empty, .fonte:empty { display: none; }
  .fonte { font-size: 11px; opacity: .45; margin-top: 6px; }
  .tarja button { margin-top: 10px; }

  .topo { position: fixed; top: 16px; right: 20px; left: 20px; display: flex; flex-wrap: wrap; justify-content: flex-end;
    gap: 8px; align-items: center; font-size: 12px; opacity: .5; transition: opacity .3s; }
  .topo:hover, .topo:focus-within { opacity: 1; }
  #status { margin-right: auto; opacity: .8; }
  button, select { background: rgba(0,0,0,.45); color: #fff; border: 1px solid rgba(255,255,255,.3);
    border-radius: 4px; padding: 6px 10px; font-size: 12px; cursor: pointer; font-family: inherit; }
  button:hover, select:hover { background: rgba(255,255,255,.2); }
  button.ativo { background: #fff; color: #000; }
  select { max-width: 180px; }
  select option { background: #111; }

  .aviso { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font-size: 16px; opacity: .75; text-align: center; padding: 20px; }

  #painel { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); background: rgba(10,10,10,.96);
    border-left: 1px solid rgba(255,255,255,.15); transform: translateX(100%); transition: transform .3s; display: flex; flex-direction: column; z-index: 5; }
  #painel.aberto { transform: none; }
  .painel-topo { display: flex; align-items: center; gap: 8px; padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,.12); }
  .painel-topo h2 { font-size: 15px; margin: 0 auto 0 0; letter-spacing: .08em; text-transform: uppercase; }
  #listaSalvos { overflow-y: auto; padding: 8px 20px 20px; flex: 1; }
  .salvo { padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
  .salvo .a { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .6; }
  .salvo .t { font-size: 15px; font-weight: 700; margin: 3px 0; }
  .salvo .g { font-size: 12px; opacity: .7; }
  .salvo .acoes { margin-top: 6px; display: flex; gap: 12px; font-size: 12px; }
  .salvo a { color: #fff; opacity: .8; }
  .salvo .remover { background: none; border: 0; padding: 0; opacity: .5; text-decoration: underline; }
  .vazio-salvos { opacity: .55; font-size: 13px; padding: 20px 0; }

  @media (max-width: 700px) {
    .tarja { left: 12px; right: 12px; bottom: 16px; max-width: none; padding: 12px 14px; }
    .titulo { font-size: 19px; }
    .topo { top: 8px; left: 8px; right: 8px; opacity: .9; }
    #status { display: none; }
    select { max-width: 120px; }
  }
</style>
</head>
<body>
  <video id="tv" playsinline></video>
  <div id="yt"></div>
  <div id="escudo"></div>

  <div class="tarja">
    <div class="linha1"><span class="anunciante" id="anunciante"></span><span class="novo" id="novo">NOVO</span></div>
    <div class="titulo" id="titulo"></div>
    <div class="agencia" id="agencia"></div>
    <div class="fonte" id="fonte"></div>
    <button id="salvar">♡ Salvar</button>
  </div>

  <div class="topo">
    <span id="status"></span>
    <button id="criativo" title="Só filmes de marca: sem oferta/preço, com agência creditada ou filme oficial no YouTube">Só criativos</button>
    <select id="filtroCategoria" title="Categoria"></select>
    <select id="filtroAgencia" title="Agência"></select>
    <button id="abrirSalvos">♥ Salvos</button>
    <button id="anterior" title="Anterior (←)">←</button>
    <button id="som">🔇 Som</button>
    <button id="proximo" title="Próximo (→)">→</button>
  </div>

  <div class="aviso" id="aviso">Carregando…</div>

  <aside id="painel">
    <div class="painel-topo">
      <h2>Salvos</h2>
      <button id="copiarSalvos">Copiar lista</button>
      <button id="fecharSalvos">Fechar</button>
    </div>
    <div id="listaSalvos"></div>
  </aside>

  <script src="tv.js?v=3"></script>
</body>
</html>

name: Atualizar comerciais

on:
  schedule:
    - cron: "17 9 * * *"     # todo dia, 06:17 em São Paulo
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/atualizar.mjs
      - name: Salvar dados.json
        run: |
          if git diff --quiet dados.json; then echo "sem mudanças"; exit 0; fi
          git config user.name "tv-de-anuncios bot"
          git config user.email "actions@users.noreply.github.com"
          git add dados.json
          git commit -m "Atualiza comerciais no ar"
          git push
